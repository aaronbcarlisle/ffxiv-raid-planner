# Dependabot version updates — enabled 2026-07-28 as part of the dev-config
# cleanup (DEV_CONFIG_CLEANUP_PLAN.md Phase 1). Monthly cadence, minor+patch
# grouped into one PR per ecosystem so the update stream stays low-noise;
# majors arrive as individual PRs and can be triaged or closed.
#
# Note: PRs authored by dependabot[bot] are skipped by claude-code-review
# (bot-PR guard) — review them manually or with /review. Lockfile-only bumps
# don't touch frontend/src or backend/app, so no release-notes entry is needed.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    # eslint-plugin-react-hooks is pinned to 7.0.1 on purpose: 7.1.x ships the
    # React-Compiler rules (preserve-manual-memoization et al.), which flag 71
    # existing call sites. Adopting those rules is a deliberate standalone task
    # — remove this ignore when that lands (context: PRs #206/#210).
    ignore:
      - dependency-name: eslint-plugin-react-hooks
      # 0.5.x makes react-refresh/only-export-components stricter (2 new
      # errors at current call sites) — same deal: adopt deliberately, then
      # remove this line (context: PR #216).
      - dependency-name: eslint-plugin-react-refresh
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: monthly
    groups:
      scripts-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
